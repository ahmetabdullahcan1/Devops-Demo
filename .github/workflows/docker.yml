name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Build & start services
        run: docker compose up -d --build

      - name: Wait for services
        run: sleep 5

      - name: Health check
        run: curl -f http://localhost:80

      - name: Shutdown
        run: docker compose down